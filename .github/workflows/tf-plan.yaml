name: terraform plan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      TVF_VAR_resource_group_name: ${{ vars.TF_RESOURCE_GROUP_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1

      - name: Terraform Init
        run: terraform init

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Plan
        run: terraform plan