name: terraform plan
on:
  pull_request:
    branches:
      - main
    types:
     - opened
     - synchronize
     - reopened

jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      TF_VAR_resource_group_name: ${{ vars.TF_RESOURCE_GROUP_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1

      - name: Terraform Init
        run: terraform init

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false
      
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: tfplan
          retention-days: 1